<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1240" viewBox="0 0 760 1240" role="img" aria-labelledby="title desc">
  <title id="title">Oheo search compact layout preview</title>
  <desc id="desc">English compact search layout with a filter disclosure containing Date order and Tags, followed by a multi-snippet result.</desc>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ink{fill:#172033}.muted{fill:#6b778b}.blue{fill:#1f66d1}.line{stroke:#dfe4eb;stroke-width:1}.small{font-size:14px}.body{font-size:16px}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  </style>
  <rect width="760" height="1240" fill="#f5f7fa"/><rect x="24" y="24" width="712" height="1192" rx="14" fill="#fff" stroke="#dfe4eb"/>
  <text x="56" y="76" class="sans ink" font-size="27" font-weight="700">Search</text><text x="56" y="105" class="sans muted small">Precise matches first</text>
  <rect x="56" y="132" width="648" height="58" rx="9" fill="#fff" stroke="#b9c5d6" stroke-width="2"/><circle cx="83" cy="160" r="10" fill="none" stroke="#718096" stroke-width="3"/><path d="M90 168l9 9" stroke="#718096" stroke-width="3" stroke-linecap="round"/><text x="116" y="167" class="sans body muted">search</text><rect x="650" y="144" width="36" height="34" rx="6" fill="#edf3ff"/><path d="M661 161h14M668 154v14" stroke="#1f66d1" stroke-width="2" stroke-linecap="round"/>
  <rect x="56" y="216" width="648" height="54" rx="9" fill="#fafbfd" stroke="#dfe4eb"/><text x="78" y="249" class="sans ink small" font-weight="700">Filters</text><text x="668" y="249" text-anchor="end" class="sans muted small">Date order · Tags</text><path d="M681 236l7 7 7-7" fill="none" stroke="#6b778b" stroke-width="2"/>
  <text x="56" y="310" class="sans ink" font-size="16" font-weight="700">Date order</text><rect x="56" y="326" width="190" height="40" rx="7" fill="#fff" stroke="#c4cedb"/><text x="76" y="352" class="sans ink small">Newest first</text><path d="M218 340l6 6 6-6" fill="none" stroke="#6b778b" stroke-width="2"/>
  <text x="56" y="414" class="sans ink" font-size="16" font-weight="700">Tags</text><rect x="56" y="430" width="648" height="40" rx="7" fill="#edf3ff"/><text x="76" y="456" class="sans ink small" font-weight="600">All tags</text><text x="684" y="456" text-anchor="end" class="sans blue small">12</text>
  <text x="56" y="502" class="sans muted small">Engineering 8   Notes 5   Tools 3   Astro 2</text><line x1="56" y1="540" x2="704" y2="540" class="line"/>
  <text x="56" y="576" class="sans muted small">12 results · 9 precise · 3 approximate</text><text x="56" y="620" class="sans muted label">Precise matches</text>
  <text x="56" y="660" class="sans ink" font-size="22" font-weight="700">Building a reliable search index</text><text x="56" y="688" class="sans muted small">POST · 2026-09-18</text>
  <rect x="56" y="708" width="648" height="64" rx="7" fill="#fafbfd" stroke="#e5e9ef"/><text x="74" y="732" class="sans blue small" font-weight="700">Introduction</text><text x="74" y="756" class="sans body ink">A practical guide to <tspan font-weight="700">search</tspan> architecture.</text>
  <rect x="56" y="784" width="648" height="64" rx="7" fill="#fafbfd" stroke="#e5e9ef"/><text x="74" y="808" class="sans blue small" font-weight="700">Ranking and filters</text><text x="74" y="832" class="sans body ink">Strict matches stay first; fuzzy <tspan font-weight="700">search</tspan> follows.</text>
  <rect x="56" y="860" width="648" height="64" rx="7" fill="#fafbfd" stroke="#e5e9ef"/><text x="74" y="884" class="sans blue small" font-weight="700">Implementation</text><text x="74" y="908" class="sans mono body ink">const <tspan font-weight="700">search</tspan> = query(input)</text>
  <text x="56" y="954" class="sans muted small">Engineering   Astro   Tools</text><line x1="56" y1="990" x2="704" y2="990" class="line"/>
  <text x="56" y="1026" class="sans muted label">Approximate matches</text><text x="56" y="1068" class="sans ink" font-size="22" font-weight="700">A weekend with a new editor</text><text x="56" y="1096" class="sans muted small">APPROXIMATE · 2026-07-12</text><text x="56" y="1134" class="sans body ink">A compact result row follows the precise tier.</text>
